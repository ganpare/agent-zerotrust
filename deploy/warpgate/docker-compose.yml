services:
  warpgate:
    image: ghcr.io/warp-tech/warpgate:latest
    container_name: warpgate
    restart: unless-stopped
    # Non-root: Warpgate only binds high ports (2222/8888) and writes to
    # /data — running as the host admin user keeps the state dir owned by
    # the admin, not root, and drops unnecessary privilege.
    user: "1000:1000"
    # Host networking: Warpgate binds the Tailscale IP directly and
    # proxies SSH to the host sshd at 127.0.0.1:22.
    network_mode: host
    volumes:
      - ./state:/data

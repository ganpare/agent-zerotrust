services:
  tetragon:
    image: quay.io/cilium/tetragon:v1.8.0
    container_name: tetragon
    restart: unless-stopped
    # Privileged is REQUIRED to load and attach BPF programs (eBPF).
    privileged: true
    pid: host
    cgroup: host
    # Export all events (exec by default + tracing policies) as JSONL —
    # this file is the evidence-pipeline pickup point.
    command:
      - --export-filename=/var/log/tetragon-events/tetragon.json
      - --export-file-max-size-mb=100
      - --export-file-max-backups=500
      - --export-file-perm=644
      # Time-based rotation: every 15 minutes a complete, immutable file
      # closes — the evidence pull ships exactly these, incrementally.
      - --export-file-rotation-interval=15m
    volumes:
      - /sys/kernel/btf/vmlinux:/var/lib/tetragon/btf:ro
      - ./policies:/etc/tetragon/tetragon.tp.d:ro
      - ./state/events:/var/log/tetragon-events

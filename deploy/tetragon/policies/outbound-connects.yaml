apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: agent-outbound-connects
spec:
  kprobes:
    - call: "security_socket_connect"
      syscall: false
      # Scoped to the acting agent's UID (kernel-side current_task cred
      # filter) — all outbound connection attempts by the agent (T4),
      # without flooding the stream with the busy host's own traffic.
      data:
        - index: 0
          type: "int"
          source: "current_task"
          resolve: "cred.uid.val"
      selectors:
        - matchData:
            - index: 0
              operator: "Equal"
              values:
                - "1001" # ai-muse
